<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 842" width="480" height="842" role="img" aria-labelledby="t d">
<title id="t">How to set up reporting properly</title>
<desc id="d">01 · SOURCES: ERP, e-shop, CRM, Excel. They change over the years. The layers below should not notice. 02 · EXTRACTION (ETL): Pulls data on a schedule, not on every refresh. If missing: the report hits the ERP directly and takes minutes to open. 03 · DATA WAREHOUSE: Clean history in one stable shape. If missing: a system change breaks every report. 04 · MODEL: Calculations and KPI definitions, written once. If missing: two reports give two different numbers for the same thing. 05 · REPORTS: Power BI: presentation only. They open and answer, because the heavy lifting happened upstream.</desc>
<rect width="480" height="842" rx="14" fill="#0f141f" stroke="#1f2937"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs>
<text x="20" y="52" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="600" fill="#f4f4f5">How to set up reporting properly</text>
<text x="20" y="74" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#a1a1aa">On top of your ERP: five layers, each with one job.</text>
<rect x="20" y="94" width="440" height="126" rx="10" fill="#161f30" stroke="#334155"/>
<text x="38" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#ff9030" letter-spacing="0.4">01 · SOURCES</text>
<text x="38" y="156" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16.5" font-weight="600" fill="#f4f4f5">ERP, e-shop, CRM, Excel</text>
<text x="38" y="184" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" fill="#a1a1aa">They change over the years. The layers below should not</text>
<text x="38" y="204" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" fill="#a1a1aa">notice.</text>

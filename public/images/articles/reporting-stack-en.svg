<text x="38" y="614" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5"><tspan font-weight="600" fill="#fdba74">If missing:</tspan><tspan fill="#d4d4d8"> two reports give two different numbers for the</tspan></text>
<text x="38" y="634" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" fill="#d4d4d8">same thing.</text>
<line x1="240" y1="653" x2="240" y2="669" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="674" width="440" height="126" rx="10" fill="#161f30" stroke="#334155"/>
<text x="38" y="704" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#ff9030" letter-spacing="0.4">05 · REPORTS</text>
<text x="38" y="736" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16.5" font-weight="600" fill="#f4f4f5">Power BI: presentation only</text>
<text x="38" y="764" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" fill="#a1a1aa">They open and answer, because the heavy lifting</text>
<text x="38" y="784" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" fill="#a1a1aa">happened upstream.</text>
<text x="460" y="826" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#71717a">batsilis.gr</text>

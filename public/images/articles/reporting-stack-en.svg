<text x="38" y="274" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#ff9030" letter-spacing="0.4">02 · EXTRACTION (ETL)</text>
<text x="38" y="306" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16.5" font-weight="600" fill="#f4f4f5">Pulls data on a schedule, not on every refresh</text>
<text x="38" y="334" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5"><tspan font-weight="600" fill="#fdba74">If missing:</tspan><tspan fill="#d4d4d8"> the report hits the ERP directly and takes</tspan></text>
<text x="38" y="354" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14.5" fill="#d4d4d8">minutes to open.</text>

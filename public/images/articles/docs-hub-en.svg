<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 930" width="480" height="930" role="img" aria-labelledby="t d">
<title id="t">How a headless documentation hub works</title>
<desc id="d">01 · AUTHORING: The team writes in Markdown and decides when to publish. Nobody needs to know code to publish an article. 02 · CMS (WORDPRESS): One platform for every product, visible only to authors. If missing: every product ends up with its own site and its own upkeep. 03 · API (GRAPHQL): Gives each application exactly the content it needs. If missing: the content cannot go anywhere except one website. 04 · SITE (ASTRO): Static pages: fast, with no database or admin on the internet. If missing: every visit loads the database and the admin stays exposed. 05 · CHANNELS: Customers, team, AI assistant. Everyone reads from one source, so everyone gets the same answer.</desc>
<rect width="480" height="930" rx="14" fill="#0f141f" stroke="#1f2937"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 580" width="730" height="580" role="img" aria-labelledby="t">
<title id="t">How the metrics architecture evolved</title>
<rect width="730" height="580" rx="14" fill="#0f141f" stroke="#1f2937"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs>
<text x="22" y="40" font-family="Inter,system-ui,sans-serif" font-size="19" font-weight="600" fill="#f4f4f5">How the metrics architecture evolved</text>
<text x="22" y="80" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#ff9030">1 · Power BI</text>
<text x="22" y="98" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">on top of the API</text>
<rect x="22" y="114" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="101.0" y="140.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Issue tracker</text>
<text x="101.0" y="157.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">API</text>
<line x1="101.0" y1="174" x2="101.0" y2="189" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="22" y="192" width="158" height="58" rx="8" fill="#2a1a0c" stroke="#ff9030"/>
<text x="101.0" y="210.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Power BI</text>
<text x="101.0" y="227.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#fdba74">Power Query</text>
<text x="101.0" y="244.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#fdba74">+ measures</text>
<text x="22" y="510" font-family="Inter,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a1a1aa">~1M records</text>
<text x="22" y="526" font-family="Inter,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a1a1aa">~10 min refresh, collapsed</text>
<text x="198" y="80" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#ff9030">2 · .NET ETL</text>
<text x="198" y="98" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">into our own database</text>
<rect x="198" y="114" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="277.0" y="140.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Issue tracker</text>
<text x="277.0" y="157.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">API</text>
<line x1="277.0" y1="174" x2="277.0" y2="189" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="198" y="192" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="277.0" y="218.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">.NET ETL</text>
<text x="277.0" y="235.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">extraction</text>
<line x1="277.0" y1="252" x2="277.0" y2="267" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="198" y="270" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="277.0" y="296.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">SQL database</text>
<text x="277.0" y="313.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">raw data</text>
<line x1="277.0" y1="330" x2="277.0" y2="345" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="198" y="348" width="158" height="58" rx="8" fill="#2a1a0c" stroke="#ff9030"/>
<text x="277.0" y="366.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Power BI</text>
<text x="277.0" y="383.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#fdba74">heavy measures</text>
<text x="277.0" y="400.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#fdba74">on every refresh</text>
<text x="198" y="510" font-family="Inter,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a1a1aa">the data moved,</text>
<text x="198" y="526" font-family="Inter,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a1a1aa">the calculations did not</text>
<text x="374" y="80" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#ff9030">3 · Analysis Services</text>
<text x="374" y="98" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">semantic model</text>
<rect x="374" y="114" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="453.0" y="140.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Issue tracker</text>
<text x="453.0" y="157.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">API</text>
<line x1="453.0" y1="174" x2="453.0" y2="189" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="374" y="192" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="453.0" y="218.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">.NET ETL</text>
<text x="453.0" y="235.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">extraction</text>
<line x1="453.0" y1="252" x2="453.0" y2="267" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="374" y="270" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="453.0" y="304.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">SQL database</text>
<line x1="453.0" y1="330" x2="453.0" y2="345" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="374" y="348" width="158" height="58" rx="8" fill="#2a1a0c" stroke="#ff9030"/>
<text x="453.0" y="374.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">SSAS model</text>
<text x="453.0" y="391.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#fdba74">calculations here</text>
<line x1="453.0" y1="408" x2="453.0" y2="423" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="374" y="426" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="453.0" y="452.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Power BI</text>
<text x="453.0" y="469.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">presentation only</text>
<text x="374" y="510" font-family="Inter,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a1a1aa">reports simply</text>
<text x="374" y="526" font-family="Inter,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a1a1aa">query the model</text>
<text x="550" y="80" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#ff9030">4 · After Jira</text>
<text x="550" y="98" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">multiple sources</text>
<rect x="550" y="114" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="629.0" y="148.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Jira + other sources</text>
<line x1="629.0" y1="174" x2="629.0" y2="189" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="550" y="192" width="158" height="58" rx="8" fill="#2a1a0c" stroke="#ff9030"/>
<text x="629.0" y="218.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Python ETL</text>
<text x="629.0" y="235.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#fdba74">multiple sources</text>
<line x1="629.0" y1="252" x2="629.0" y2="267" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="550" y="270" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="629.0" y="304.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Data warehouse</text>
<line x1="629.0" y1="330" x2="629.0" y2="345" stroke="#52525b" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="550" y="348" width="158" height="58" rx="8" fill="#161f30" stroke="#334155"/>
<text x="629.0" y="366.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#f4f4f5">Support</text>
<text x="629.0" y="383.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">platform</text>
<text x="629.0" y="400.0" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">metrics + ETL</text>
<text x="550" y="510" font-family="Inter,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a1a1aa">new source, new schema:</text>
<text x="550" y="526" font-family="Inter,system-ui,sans-serif" font-size="12" font-style="italic" fill="#a1a1aa">rebuilt from scratch</text>
<rect x="22" y="550" width="12" height="12" rx="2" fill="#2a1a0c" stroke="#ff9030"/>
<text x="42" y="560" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#a1a1aa">Orange: where the heavy lifting happens</text>
</svg>